pre-commit:
  files: git diff --name-only --cached
  parallel: true
  jobs:
    - name: oxfmt
      glob: "*.{js,jsx,ts,tsx,vue,json,jsonc,css,yml,yaml}"
      run: pnpm oxfmt {staged_files}

    - name: oxlint
      glob: "*.{js,jsx,ts,tsx,vue}"
      run: pnpm oxlint {staged_files}

    - name: mdclint
      glob:
        - "README.md"
        - "content/**/*.md"
      run: pnpm mdclint {staged_files}

pre-push:
  jobs:
    - name: build
      # A push containing only deletions would otherwise skip the build:
      # lefthook derives the push file list from `git diff --name-only HEAD
      # @{push}`, and a deletion-only range yields no paths, so the job is
      # treated as having nothing to inspect. `skip: false` disables that
      # emptiness check so the build always runs before pushing.
      skip: false
      run: pnpm build
